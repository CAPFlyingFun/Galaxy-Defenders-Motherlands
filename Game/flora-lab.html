<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Flora Lab · Galaxy Defenders: Motherlands</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141c; color: #eaf2ff; overflow: hidden;
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; }
  /* The lab's buttons: a strip along the top, so the bottom corners stay free as in the game. */
  #panel { position: fixed; left: 6px; right: 6px; top: 6px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  #panel button { min-height: 28px; padding: 3px 8px; border-radius: 8px; border: 1px solid #ffffff40; background: #1a2230d0;
    color: #eaf2ff; font: 700 11px system-ui, sans-serif; letter-spacing: .03em; }
  #panel button.on { background: #1f7a6a; border-color: #5cf2d4; }
  #panel .gap { width: 8px; }
  #status { position: fixed; left: 8px; bottom: 6px; right: 8px; font: 600 11px ui-monospace, monospace; opacity: .9;
    white-space: pre-wrap; pointer-events: none; text-align: center; text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<div id="app"></div>
<div id="panel"></div>
<div id="status">Growing the flora…</div>
<script type="module" src="/src/floraLab.ts"></script>
</body>
</html>
