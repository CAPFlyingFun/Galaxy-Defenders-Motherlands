<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04060d">
<meta name="apple-mobile-web-app-title" content="Motherlands">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<title>Galaxy Defenders: Motherlands</title>
<style>
  html, body { margin: 0; height: 100%; background: #04060d; color: #eaf2ff; overflow: hidden;
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Arial, sans-serif;
    touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
  /* THE STAGE: everything the game draws. It is kept landscape by src/core/orientation.ts, which sets its size and,
     on a phone held upright, turns it a quarter turn about its top-left corner. The four --safe-* numbers are the
     space the phone keeps for its notch and home bar, named by the side of the GAME they are on. */
  #stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; overflow: hidden;
    --safe-left: env(safe-area-inset-left, 0px); --safe-right: env(safe-area-inset-right, 0px);
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  /* Turned: the game's left edge is the TOP of the phone, its right edge the bottom, and so on round. */
  #stage.is-rotated {
    --safe-left: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-right, 0px); --safe-bottom: env(safe-area-inset-left, 0px); }
  #app { position: absolute; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; }
  /* The controls layer lies over the game. It lets touches through; each control switches them back on for itself (src/ui/hud.css). */
  #ui { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="app"></div>
  <div id="ui"></div>
</div>
<script type="module" src="/src/main.ts"></script>
<script type="module" src="/src/ui/versionTag.ts"></script>
</body>
</html>
