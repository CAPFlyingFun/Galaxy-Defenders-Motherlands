<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04060d">
<meta name="apple-mobile-web-app-title" content="Motherlands">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<title>Galaxy Defenders: Motherlands</title>
<style>
  html, body { margin: 0; height: 100%; background: #04060d; color: #eaf2ff; overflow: hidden;
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Arial, sans-serif;
    touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
  /* THE STAGE: everything the game draws (the 3D picture and the controls). It simply fills the screen; the game is
     played in landscape, and src/core/orientation.ts tells the game whenever the stage changes size. The four
     --safe-* numbers are the space the phone keeps for its notch, rounded corners and home bar. */
  /* (Its size comes from src/core/screenFit.ts: the screen measured once as a landscape pair, --gd-w x --gd-h, so it
     stays landscape even while the phone is upright behind the cover, and a turn never resizes the 3D picture.
     Until that code has run, it simply fills the screen.) */
  #stage { position: fixed; left: 0; top: 0; width: var(--gd-w, 100%); height: var(--gd-h, 100%); overflow: hidden;
    --safe-left: env(safe-area-inset-left, 0px); --safe-right: env(safe-area-inset-right, 0px);
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  #app { position: absolute; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; }
  /* The controls layer lies over the game. It lets touches through; each control switches them back on for itself (src/ui/hud.css). */
  #ui { position: absolute; inset: 0; pointer-events: none; }

  /* ==================================================================================================================
     THE SPLASH: the first thing on screen, while everything loads (Joshua, 2026-11-17: "a simple splash screen while
     loading up everything with maybe an actual loading bar with percentage and estimated time remaining").

     It is written straight into this page (its words below, its looks here), not made by the game's code, so it is on
     screen from the very first moment: before the game's code has even arrived. The code then fills it in
     (src/ui/splash.ts) from an honest measure of the loading (src/core/loadMeter.ts) and takes it away when the game
     is ready. The colours are the controls' own (src/ui/hud.css).
     ================================================================================================================== */
  #splash { position: fixed; left: 0; top: 0; width: var(--gd-w, 100%); height: var(--gd-h, 100%); z-index: 900; box-sizing: border-box; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    /* (kept clear of the phone's notch, rounded corners and home bar) */
    padding: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-right, 0px) + 28px)
             calc(env(safe-area-inset-bottom, 0px) + 16px) calc(env(safe-area-inset-left, 0px) + 28px);
    background: radial-gradient(120% 95% at 50% 108%, #1a2740 0%, #101a2e 38%, #04060d 78%);
    color: #eaf2ff; transition: opacity .4s ease; }
  /* The game is ready: the splash fades away and stops taking touches (the code then removes it). */
  #splash.is-done { opacity: 0; pointer-events: none; }
  /* A faint outline of the dome, rising behind the words. */
  #splash::before { content: ''; position: absolute; left: 6%; right: 6%; top: 9%; bottom: -2px;
    border: 1px solid rgba(94, 232, 200, .3); border-bottom: 0; border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    box-shadow: inset 0 26px 60px -34px rgba(94, 232, 200, .5); pointer-events: none; }
  .splash-box { position: relative; width: min(100%, 460px); text-align: center; }
  .splash-kicker { font-size: 12px; font-weight: 700; letter-spacing: .42em; margin-right: -.42em; color: #5ee8c8; }
  .splash-title { margin: 6px -.2em 22px 0; font-size: clamp(26px, 6.2vw, 40px); font-weight: 800; letter-spacing: .2em;
    line-height: 1.1; color: #ffd56b; text-shadow: 0 0 22px rgba(255, 213, 107, .35); }
  /* THE BAR: a track, and inside it the part that is done (its width is set by the code, 0% to 100%). */
  .splash-bar { position: relative; height: 12px; border: 1px solid rgba(94, 232, 200, .55); border-radius: 8px;
    background: rgba(16, 26, 46, .8); overflow: hidden; }
  .splash-fill { width: 0%; height: 100%; border-radius: 7px; background: linear-gradient(90deg, #3fc9aa, #5ee8c8);
    box-shadow: 0 0 14px rgba(94, 232, 200, .7); transition: width .35s ease-out; }
  /* A soft light sweeping along the bar, so the screen is never quite still even while a long step is being worked
     on. (It is moved by the phone's graphics chip, so it keeps going when the game's code is too busy to redraw.) */
  .splash-bar::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 34%;
    background: linear-gradient(90deg, transparent, rgba(234, 242, 255, .34), transparent);
    transform: translateX(-110%); animation: splash-sweep 1.7s linear infinite; will-change: transform; }
  @keyframes splash-sweep { to { transform: translateX(400%); } }
  /* Under the bar: what is loading (left) and the percentage (right); under that, the time left. */
  .splash-line { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; margin-top: 10px;
    font-size: 13px; letter-spacing: .03em; }
  .splash-step { flex: 1; min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .splash-percent { font-size: 17px; font-weight: 800; color: #5ee8c8; font-variant-numeric: tabular-nums; }
  /* (its line keeps its height when it is empty, so nothing shifts when the time appears) */
  .splash-time { min-height: 1.4em; margin-top: 4px; text-align: left; font-size: 12px; letter-spacing: .03em; color: #8fa3c8; }
  /* Loading failed: the words say so, in gold, and the light stops sweeping. */
  #splash.is-broken .splash-step { white-space: normal; }
  #splash.is-broken .splash-bar::after { animation: none; opacity: 0; }

  /* ==================================================================================================================
     THE ROTATE COVER: the game is played in landscape (Joshua, 2026-11-17: "Make it like how Beyond Extinction does
     it ... will say, game is played in landscape, please rotate your device to play").

     Whenever a touch screen is held upright this covers everything: the splash while loading, the game while
     playing (which pauses: src/ui/pauseMenu.ts). It is shown and hidden by the browser itself, with the rule just
     below ("the screen is taller than wide AND is worked by a finger"), so no code can ever leave it stuck on.
     A computer with a mouse is never covered, however narrow its window: it cannot be turned on its side.
     (src/core/orientation.ts asks the browser the very same question to know when to pause. Keep the two the same.)
     ================================================================================================================== */
  /* WHEN IT SHOWS: src/core/screenFit.ts reads the phone's own ANGLE (never stuck, unlike the page's size after a
     turn) and labels the page "gd-upright". Before that code has run, the browser's own portrait test stands in. */
  #rotate-cover { display: none; position: fixed; left: 0; top: 0; z-index: 1000; box-sizing: border-box;
      width: var(--gd-cw, 100%); height: var(--gd-ch, 100%);
      align-items: center; justify-content: center; text-align: center;
      padding: calc(env(safe-area-inset-top, 0px) + 24px) calc(env(safe-area-inset-right, 0px) + 28px)
               calc(env(safe-area-inset-bottom, 0px) + 24px) calc(env(safe-area-inset-left, 0px) + 28px);
      background: radial-gradient(95% 60% at 50% 46%, #101a2e 0%, #04060d 72%); color: #eaf2ff; pointer-events: auto; }
  html.gd-fit.gd-upright #rotate-cover { display: flex; }

  /* UPRIGHT WHILE PLAYING (Joshua, 2026-11-17): "a hybrid of the pause menu and message on the top, and the last part
     the game", with a yellow double pause sign over the game, half blacked out. The game's box keeps its landscape
     size and is only SHRUNK (a transform: nothing is resized or rebuilt) to the phone's width, along the bottom.
     The cover stops above it and carries the pause menu. (While still loading, the cover fills the screen.) */
  html.gd-playing.gd-upright #stage { transform-origin: 0 0; transform: translate(0, var(--gd-strip-top)) scale(var(--gd-scale)); }
  html.gd-playing.gd-upright #rotate-cover { height: var(--gd-strip-top); border-bottom: 1px solid rgba(94, 232, 200, .35);
    overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; align-items: safe center; }
  /* the controls are hidden in the strip (it is a picture of the game, not something to play) */
  html.gd-upright .gd-hud { visibility: hidden; }
  /* the pause menu's own card is not shown in the strip: the yellow pause sign is (src/ui/pauseMenu.css) */
  @media (orientation: portrait) and (pointer: coarse) { html:not(.gd-fit) #rotate-cover { display: flex; width: 100%; height: 100%; } }
  /* Upright, the splash is hidden behind the cover (it keeps loading). */
  html.gd-upright #splash { visibility: hidden; }
  .rotate-box { max-width: 300px; }
  /* A little phone that turns onto its side, over and over. */
  .rotate-phone { width: 46px; height: 82px; margin: 0 auto 30px; border: 3px solid #5ee8c8; border-radius: 11px;
    box-shadow: 0 0 18px rgba(94, 232, 200, .45); animation: rotate-phone 2.4s ease-in-out infinite; }
  @keyframes rotate-phone { 0%, 28% { transform: rotate(0deg); } 62%, 100% { transform: rotate(-90deg); } }
  .rotate-title { margin-bottom: 10px; font-size: 21px; font-weight: 800; letter-spacing: .14em; color: #ffd56b; }
  .rotate-hint { margin: 0; font-size: 15px; line-height: 1.5; }
  .rotate-note { margin: 18px 0 0; font-size: 12px; line-height: 1.5; color: #8fa3c8; }
  /* Two sets of words: while loading ("rotate your device") and while playing ("paused"). */
  .rotate-play, .rotate-pause { display: none; }
  .rotate-loading { margin-top: 26px; text-align: left; }
  html.gd-playing .rotate-play { display: block; }
  html.gd-playing .rotate-pause { display: block; }
  html.gd-playing .rotate-load { display: none; }
  html.gd-playing .rotate-phone { margin-bottom: 20px; }
  /* The pause buttons, as in the pause menu (src/ui/pauseMenu.css); and the game's Settings panel when it is moved
     in here (it uses the controls' colours, so they are given here too). */
  .rotate-pause { margin-top: 18px; --line: rgba(94, 232, 200, 0.55); --navy: rgba(16, 26, 46, 0.72); --teal: #5ee8c8; --gold: #ffd56b; --text: #eaf2ff; }
  .rotate-pause button { display: block; width: 100%; min-height: 46px; margin-top: 10px; border-radius: 10px; color: #eaf2ff;
    font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .06em; touch-action: manipulation; }
  .rotate-resume { border: 1px solid rgba(94, 232, 200, .35); background: transparent; color: #8fa3c8 !important; }
  .rotate-resume small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .04em; }
  .rotate-settings { border: 1px solid rgba(94, 232, 200, .55); background: #101a2e; }
  .rotate-settings-slot .gd-settings { position: static; max-height: none; min-width: 0; margin-top: 12px; text-align: left; font-size: 14px; }

  /* Someone who has asked their device for less movement gets a still bar and a still phone. */
  @media (prefers-reduced-motion: reduce) {
    .splash-bar::after, .rotate-phone { animation: none; }
    .splash-bar::after { opacity: 0; }
    .rotate-phone { transform: rotate(-90deg); }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="app"></div>
  <div id="ui"></div>
</div>

<!-- THE SPLASH (its looks are in the styles above; src/ui/splash.ts fills in the bar, the words and the time). -->
<div id="splash" role="status">
  <div class="splash-box">
    <div class="splash-kicker">GALAXY DEFENDERS</div>
    <div class="splash-title">MOTHERLANDS</div>
    <div class="splash-bar" id="splash-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="splash-fill" id="splash-fill"></div>
    </div>
    <div class="splash-line">
      <span class="splash-step" id="splash-step">Starting…</span>
      <span class="splash-percent" id="splash-percent">0%</span>
    </div>
    <div class="splash-time" id="splash-time"></div>
  </div>
</div>

<!-- THE ROTATE COVER (shown by the styles above whenever a touch screen is held upright; there is no code behind it). -->
<div id="rotate-cover" role="alert">
  <div class="rotate-box">
    <div class="rotate-phone"></div>
    <div class="rotate-title rotate-load">ROTATE YOUR DEVICE</div>
    <p class="rotate-hint rotate-load">Galaxy Defenders is played in landscape. Please turn your device on its side to play.</p>
    <!-- LOADING, UPRIGHT (Joshua, 2026-11-17: let it load at first launch in portrait for a head start). It does load
         behind this cover; this shows how far along it is (filled in by src/ui/splash.ts, the same as the splash). -->
    <div class="rotate-loading rotate-load">
      <div class="splash-bar"><div class="splash-fill" id="rotate-fill"></div></div>
      <div class="splash-line"><span class="splash-step" id="rotate-step">Starting…</span><span class="splash-percent" id="rotate-percent">0%</span></div>
      <div class="splash-time" id="rotate-time"></div>
    </div>
    <div class="rotate-title rotate-play">PAUSED</div>
    <p class="rotate-hint rotate-play">Turn your phone on its side to keep playing.</p>
    <p class="rotate-note">Nothing happening? Switch off rotation lock.</p>
    <!-- the pause menu's buttons for an upright phone (wired up by src/ui/pauseMenu.ts once the game has started) -->
    <div class="rotate-pause">
      <button class="rotate-resume" type="button">Resume<small>turn your phone on its side</small></button>
      <button class="rotate-settings" type="button">Settings</button>
      <div class="rotate-settings-slot"></div>
    </div>
  </div>
</div>

<script type="module" src="/src/core/screenFit.ts"></script>
<script type="module" src="/src/main.ts"></script>
<script type="module" src="/src/ui/versionTag.ts"></script>
<script type="module" src="/src/ui/layoutEditor.ts"></script>
</body>
</html>
